name: Build, test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group browser
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  image:
    name: Docker build and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nanokvm-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check running container and persistent storage
        shell: bash
        run: |
          set -euo pipefail
          docker volume create dashboard-smoke
          docker run -d --name dashboard-smoke \
            -p 127.0.0.1:18999:8080 -e MDNS_ENABLED=false \
            -v dashboard-smoke:/data nanokvm-dashboard:ci
          trap 'docker logs dashboard-smoke; docker rm -f dashboard-smoke' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:18999/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18999/healthz
          curl -fsS http://127.0.0.1:18999/static/app.js -o /dev/null
          curl -fsS -X POST http://127.0.0.1:18999/api/devices \
            -H 'Content-Type: application/json' \
            -d '{"name":"Persistence test","url":"http://192.168.254.254"}'
          docker restart dashboard-smoke
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:18999/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18999/api/devices | \
            python -c 'import json,sys; d=json.load(sys.stdin); assert d["devices"][0]["name"] == "Persistence test"'

  publish:
    name: Publish to GHCR
    needs: [test, image]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
